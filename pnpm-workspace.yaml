packages:
  - apps/*
  - packages/*
  - packages/plugins/*/*

catalog:
  '@testing-library/dom': ^10.4.1
  '@testing-library/jest-dom': ^6.9.1
  '@testing-library/user-event': ^14.6.1
  '@types/bun': ^1.3.14
  '@types/node': ^25.9.1
  '@types/react': ^19.2.15
  happy-dom: ^20.9.0
  jsdom: ^29.1.1
  publint: ^0.3.21
  react: ^19.2.6
  react-dom: ^19.2.6
  typescript: ^6.0.3
  vite: npm:@voidzero-dev/vite-plus-core@latest
  vite-plugin-dts: ^4.5.4
  vite-plus: ^0.1.23
  vitest: npm:@voidzero-dev/vite-plus-test@latest

overrides:
  vite: 'catalog:'
  vitest: 'catalog:'

peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'
