name: CI

on:
  pull_request:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: lts
          cache: true
      - run: pnpm run build
      - run: pnpm run lint

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: lts
          cache: true
      - run: pnpm run format:check

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: lts
          cache: true
      - run: pnpm run typecheck

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: lts
          cache: true
      - run: pnpm run build

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: lts
          cache: true
      - run: pnpm run test

  docs:
    name: Docs build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: lts
          cache: true
      # Builds the Astro/Starlight docs (apps/web-docs) via the strict wrapper,
      # which fails on any broken Twoslash code snippet. External links are
      # checked on a schedule in link-check.yml.
      - run: pnpm docs:build

  size:
    name: Bundle size
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: lts
          cache: true
      - run: pnpm run build
      - run: pnpm -F @blac/core -F @blac/react size
