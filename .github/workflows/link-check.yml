name: Link check

# The `docs` job in ci.yml builds the Astro/Starlight docs on every PR. This
# workflow checks *external* URLs on a schedule, where transient failures
# won't block PRs.

on:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC
  workflow_dispatch:

jobs:
  links:
    name: External links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check external links
        uses: lycheeverse/lychee-action@v2
        with:
          # 429 (rate limited) is accepted to reduce flakiness on busy hosts.
          args: >-
            --no-progress
            --max-retries 3
            --accept 200,206,429
            'apps/web-docs/src/content/docs/**/*.md'
            'apps/web-docs/src/content/docs/**/*.mdx'
            'README.md'
            'packages/*/README.md'
          fail: true
