<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>State management benchmarks</title>
    <link rel="stylesheet" href="/bootstrap.css" />
    <script>
      // The React DevTools extension measures every committed host node,
      // forcing a synchronous layout per commit. Opt out unless ?devtools.
      if (
        window.__REACT_DEVTOOLS_GLOBAL_HOOK__ &&
        !location.search.includes('devtools')
      ) {
        window.__REACT_DEVTOOLS_GLOBAL_HOOK__.isDisabled = true;
      }
    </script>
  </head>
  <body>
    <div id="main"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
